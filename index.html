<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annecy Sim</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">Chargement d'Annecy…</div>
    <header id="hud">
      <div class="title">Annecy</div>
      <div id="time"></div>
      <div id="weather"></div>
      <div class="controls">
        <button id="play" title="Pause / lecture"></button>
        <button data-speed="0.33">x⅓</button>
        <button data-speed="1" class="active">x1</button>
        <button data-speed="3">x3</button>
        <button data-speed="10">x10</button>
        <button data-speed="realtime" title="1 seconde = 1 seconde">⏱ Temps réel</button>
        <button id="traffic" title="Fluidité de chaque rue, du vert au rouge">🚦 Trafic</button>
        <label><input id="labels" type="checkbox" checked /> Lieux</label>
        <label title="Taille des habitants">Habitants <input id="agentSize" type="range" min="1" max="4" step="0.5" value="2" /></label>
      </div>
    </header>
    <aside id="live" class="panel">
      <div class="panel-title">En ce moment</div>
      <div id="counts"></div>
      <div id="legend"></div>
    </aside>
    <aside id="today" class="panel"></aside>
    <div id="right">
      <aside id="decisions" class="panel hidden"></aside>
      <aside id="agent" class="panel hidden"></aside>
      <aside id="report" class="panel hidden"></aside>
    </div>
    <aside id="feed" class="panel"><div class="panel-title">💬 Ce que disent les habitants</div></aside>
    <div id="command">
      <div id="proposal" class="hidden"></div>
      <form id="command-form" autocomplete="off">
        <span>🏛️</span>
        <input id="command-input" placeholder="Une décision pour Annecy ? ex. « ferme l'avenue de Genève pour travaux pendant 2 semaines »" />
        <label class="extreme-toggle" title="Autorise les catastrophes spectaculaires (météorite, tsunami, OVNI…)"><input id="extreme" type="checkbox" /> Scénarios extrêmes</label>
        <button type="submit">Envoyer</button>
      </form>
      <div id="chips"></div>
    </div>
    <footer id="credits">© contributeurs OpenStreetMap</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
