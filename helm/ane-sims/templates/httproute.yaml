{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ane-sims.fullname" . }}
  labels:
    {{- include "ane-sims.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    - name: {{ required "httpRoute.parentRefs[].name is required" .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
    {{- end }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- if or .Values.httpRoute.timeouts.request .Values.httpRoute.timeouts.backendRequest }}
      timeouts:
        {{- with .Values.httpRoute.timeouts.request }}
        request: {{ . | quote }}
        {{- end }}
        {{- with .Values.httpRoute.timeouts.backendRequest }}
        backendRequest: {{ . | quote }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ include "ane-sims.fullname" $ }}
          port: {{ $.Values.service.port }}
{{- end }}
